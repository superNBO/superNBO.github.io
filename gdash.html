<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Web - Remastered</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 480px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            background: linear-gradient(to bottom, #1a2a6c, #11998e);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 52px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0px #000;
        }
        .btn {
            background: #00E676;
            color: #000;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: 900;
            box-shadow: 0 5px #00a152;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 #00a152;
        }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .level-btn {
            background: #29b6f6;
            box-shadow: 0 5px #0288d1;
        }
        .level-btn:active {
            box-shadow: 0 0 #0288d1;
        }
        #progress-bar-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            z-index: 5;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00E676, #69f0ae);
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        #attempts-text {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 900;
            font-size: 18px;
            z-index: 5;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="480"></canvas>

    <div id="progress-bar-container" class="hidden">
        <div id="progress-fill"></div>
    </div>
    <div id="attempts-text" class="hidden">Attempt 1</div>

    <!-- Main Menu -->
    <div id="main-menu" class="ui-layer">
        <h1>Dash Web</h1>
        <p>Hold SPACE, UP ARROW, or TOUCH to jump/fly</p>
        <div class="level-grid">
            <button class="btn level-btn" onclick="startGame(0)">1. Stereo</button>
            <button class="btn level-btn" onclick="startGame(1)">2. Flight</button>
            <button class="btn level-btn" onclick="startGame(2)">3. Switcher</button>
            <button class="btn level-btn" onclick="startGame(3)">4. Jumper</button>
            <button class="btn level-btn" onclick="startGame(4)">5. The Core</button>
        </div>
    </div>

    <!-- Death Screen -->
    <div id="death-screen" class="ui-layer hidden">
        <h1 style="color: #ff5252;">Crashed!</h1>
        <p id="death-percent" style="font-size: 24px; font-weight: bold;">0%</p>
        <button class="btn" style="background: #ff5252; box-shadow: 0 5px #d50000; color: white;" onclick="restartLevel()">Try Again</button>
        <button class="btn" style="background: #757575; box-shadow: 0 5px #424242; color: white;" onclick="showMenu()">Menu</button>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="ui-layer hidden">
        <h1 style="color: #69f0ae;">Level Complete!</h1>
        <p id="win-attempts" style="font-size: 24px; font-weight: bold;">Attempts: 1</p>
        <button class="btn" onclick="showMenu()">Continue</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const TILE_SIZE = 40;

    // UI Elements
    const mainMenu = document.getElementById('main-menu');
    const deathScreen = document.getElementById('death-screen');
    const winScreen = document.getElementById('win-screen');
    const progressContainer = document.getElementById('progress-bar-container');
    const progressFill = document.getElementById('progress-fill');
    const attemptsText = document.getElementById('attempts-text');
    const deathPercent = document.getElementById('death-percent');
    const winAttempts = document.getElementById('win-attempts');

    // Game State
    let state = 'menu'; // menu, playing, dead, win
    let currentLevel = 0;
    let cameraX = 0;
    let attempts = 1;
    let particles = [];
    let isHolding = false;
    let mapWidth = 0;

    // Player Object
    const player = {
        x: 0,
        y: 0,
        width: 30,
        height: 30,
        vy: 0,
        speed: 6.5,
        rotation: 0,
        mode: 'cube',
        isGrounded: false,
        cubeGravity: 0.85,
        cubeJump: -12.5,
        shipGravity: 0.35,
        shipFlyPower: -0.6,
        shipMaxVy: 8
    };

    // . = Empty, # = Block, ^ = Spike, > = Ship Portal, < = Cube Portal, W = Win Object
    const levelsData = [
        // Level 1: Stereo (Cube Basics)
        [
            "....................................................................................................",
            "....................................................................................................",
            "....................................................................................................",
            "....................................................................................................",
            "....................................................................................................",
            "........................................###.........................................................",
            "......................^.........#.......###........^^..........#........#........^^................W",
            "####################################################################################################"
        ],
        // Level 2: Flight (Ship Basics)
        [
            "####################################################################################################",
            "...................................................###..............................................",
            "...................................#####...........###..................######......................",
            "...................................#####................................######......................",
            "...................######...........................................................................",
            ".............>.....######......................................###..................................",
            "...............................................................###.................................W",
            "####################################################################################################"
        ],
        // Level 3: Switcher (Transitions)
        [
            "....................................................................................................",
            "........................................#####################################.......................",
            "........................................#.......................######......#.......................",
            "........................................#.......######..........######......#.......................",
            "........................................#.......######..............................................",
            "..................................>..............................................<..................",
            "......................^^......................................####..........#............^^........W",
            "####################################################################################################"
        ],
        // Level 4: Jumper (Platforming & Spikes)
        [
            "....................................................................................................",
            "....................................................................................................",
            "....................................................................................................",
            "....................................................................................................",
            "..................................####..............................................................",
            "............................####........####........................................................",
            "......................####....................####..............^^^.......^^.......................W",
            "########################^^^^^^^^^^^^^^^^^^^^^^^^^^##################################################"
        ],
        // Level 5: The Core (Tight Corridors & Quick Reflexes)
        [
            "..........................................#########################################.................",
            "..........................................#.......................................#.................",
            "..........................................#.............####......................#.................",
            "..........................................#.............####......................#.................",
            "..........................................#........................####.............................",
            "............................###....................................####.............................",
            "......................###.........###.............>................####................<...........W",
            "########################^^^^^^^^^^^^^^^^##################################################^^########"
        ]
    ];

    let objects = [];

    // Web Audio API Synthesizer (Zero Assets Needed)
    let audioCtx;
    let musicTimerID;
    let nextNoteTime = 0;
    let current16thNote = 0;

    function playKick(time) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        osc.start(time);
        osc.stop(time + 0.5);
    }

    function playHat(time) {
        if(!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7000;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(time);
    }

    function playBass(time, noteIndex) {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        const freqs = [65.41, 65.41, 73.42, 58.27];
        const freq = freqs[Math.floor(noteIndex / 16) % freqs.length];
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
        osc.start(time);
        osc.stop(time + 0.2);
    }

    function playCrashSound() {
        if(!audioCtx) return;
        const time = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, time);
        osc.frequency.exponentialRampToValueAtTime(5, time + 0.4);
        gain.gain.setValueAtTime(0.8, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(time);
        osc.stop(time + 0.4);
    }

    function scheduleMusic() {
        if (state !== 'playing' && state !== 'win') return;
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            if (current16thNote % 4 === 0) playKick(nextNoteTime);
            if (current16thNote % 2 === 1) playHat(nextNoteTime);
            if (current16thNote % 4 !== 0) playBass(nextNoteTime, current16thNote);
            nextNoteTime += 0.115;
            current16thNote++;
        }
        musicTimerID = requestAnimationFrame(scheduleMusic);
    }

    function startMusic() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        cancelAnimationFrame(musicTimerID);
        nextNoteTime = audioCtx.currentTime + 0.05;
        current16thNote = 0;
        scheduleMusic();
    }

    function stopMusic() {
        cancelAnimationFrame(musicTimerID);
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = false;
    });
    window.addEventListener('mousedown', () => isHolding = true);
    window.addEventListener('mouseup', () => isHolding = false);
    window.addEventListener('touchstart', (e) => {
        e.preventDefault();
        isHolding = true;
    }, {passive: false});
    window.addEventListener('touchend', () => isHolding = false);

    function jump() {
        player.vy = player.cubeJump;
        player.isGrounded = false;
    }

    function parseLevel(levelIndex) {
        objects = [];
        const data = levelsData[levelIndex];
        const rows = data.length;
        mapWidth = data[0].length * TILE_SIZE;

        const offsetY = canvas.height - (rows * TILE_SIZE);

        for (let y = 0; y < rows; y++) {
            const row = data[y];
            for (let x = 0; x < row.length; x++) {
                const char = row[x];
                const px = x * TILE_SIZE;
                const py = y * TILE_SIZE + offsetY;

                if (char === '#') objects.push({ type: 'block', x: px, y: py, w: TILE_SIZE, h: TILE_SIZE });
                if (char === '^') objects.push({ type: 'spike', x: px, y: py, w: TILE_SIZE, h: TILE_SIZE, dir: 'up' });
                if (char === '>') objects.push({ type: 'portal', x: px, y: py - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 2, mode: 'ship' });
                if (char === '<') objects.push({ type: 'portal', x: px, y: py - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 2, mode: 'cube' });
                if (char === 'W') objects.push({ type: 'win', x: px, y: py - TILE_SIZE*2, w: TILE_SIZE, h: TILE_SIZE * 3 });
            }
        }

        // Spawn Player securely on the starting padding floor (Tile 5)
        player.x = 200;
        player.y = offsetY + (rows - 2) * TILE_SIZE + (TILE_SIZE - player.height);
    }

    function showMenu() {
        state = 'menu';
        stopMusic();
        mainMenu.classList.remove('hidden');
        deathScreen.classList.add('hidden');
        winScreen.classList.add('hidden');
        progressContainer.classList.add('hidden');
        attemptsText.classList.add('hidden');
    }

    function startGame(levelIndex) {
        currentLevel = levelIndex;
        attempts = 1;
        mainMenu.classList.add('hidden');
        winScreen.classList.add('hidden');
        progressContainer.classList.remove('hidden');
        attemptsText.classList.remove('hidden');
        initLevel();
    }

    function restartLevel() {
        attempts++;
        deathScreen.classList.add('hidden');
        initLevel();
    }

    function initLevel() {
        state = 'playing';
        parseLevel(currentLevel);

        player.vy = 0;
        player.rotation = 0;
        player.mode = 'cube';
        player.isGrounded = false;

        cameraX = 0;
        particles = [];
        attemptsText.innerText = `Attempt ${attempts}`;
        progressFill.style.width = '0%';

        startMusic();
    }

    function createExplosion(x, y) {
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 18,
                vy: (Math.random() - 0.5) * 18,
                size: Math.random() * 8 + 4,
                life: 1,
                color: player.mode === 'cube' ? '#00E676' : '#FF4081'
            });
        }
    }

    function die() {
        if (state === 'dead') return;
        state = 'dead';
        stopMusic();
        playCrashSound();
        createExplosion(player.x + player.width / 2, player.y + player.height / 2);

        const percent = Math.min(100, Math.floor((player.x / mapWidth) * 100));
        deathPercent.innerText = `${percent}%`;

        setTimeout(() => {
            deathScreen.classList.remove('hidden');
        }, 800);
    }

    function win() {
        if (state === 'win') return;
        state = 'win';
        winAttempts.innerText = `Attempts: ${attempts}`;
        progressFill.style.width = '100%';
        setTimeout(() => {
            winScreen.classList.remove('hidden');
        }, 1000);
    }

    function update() {
        if (state === 'playing') {

            // Fixed Continuous Jumping Logic
            if (player.mode === 'cube') {
                if (isHolding && player.isGrounded) jump();

                player.vy += player.cubeGravity;
                if (player.vy > 15) player.vy = 15;

                if (!player.isGrounded) {
                    player.rotation += 7;
                } else {
                    const snap = Math.round(player.rotation / 90) * 90;
                    player.rotation += (snap - player.rotation) * 0.3;
                }
            } else if (player.mode === 'ship') {
                if (isHolding) {
                    player.vy += player.shipFlyPower;
                } else {
                    player.vy += player.shipGravity;
                }

                if (player.vy > player.shipMaxVy) player.vy = player.shipMaxVy;
                if (player.vy < -player.shipMaxVy) player.vy = -player.shipMaxVy;
                player.rotation = player.vy * 3.5;
            }

            // Move X
            player.x += player.speed;
            cameraX = player.x - 200;

            // X Collisions
            const pRectX = { x: player.x, y: player.y, w: player.width, h: player.height };
            for (let obj of objects) {
                if (obj.x < cameraX - 100 || obj.x > cameraX + 900) continue;

                if (obj.type === 'block') {
                    if (isOverlap(pRectX, obj)) { die(); break; }
                } else if (obj.type === 'spike') {
                    // Spike hitbox is much smaller for fair gameplay
                    const spikeHitbox = { x: obj.x + 10, y: obj.y + 18, w: obj.w - 20, h: obj.h - 18 };
                    if (isOverlap(pRectX, spikeHitbox)) die();
                } else if (obj.type === 'portal') {
                    if (isOverlap(pRectX, obj)) {
                        player.mode = obj.mode;
                        if (player.mode === 'ship' && player.vy > 0) player.vy = 0;
                    }
                } else if (obj.type === 'win') {
                    if (isOverlap(pRectX, obj)) win();
                }
            }

            if (state !== 'playing') return;

            // Move Y
            player.y += player.vy;
            player.isGrounded = false;

            // Y Collisions
            const pRectY = { x: player.x, y: player.y, w: player.width, h: player.height };
            for (let obj of objects) {
                if (obj.x < cameraX - 100 || obj.x > cameraX + 900) continue;

                if (obj.type === 'block') {
                    if (isOverlap(pRectY, obj)) {
                        if (player.vy > 0) { // Landing on top
                            player.y = obj.y - player.height;
                            player.vy = 0;
                            player.isGrounded = true;
                        } else if (player.vy < 0) { // Hitting ceiling
                            player.y = obj.y + obj.h;
                            player.vy = 0;
                            if (player.mode === 'cube') die();
                        }
                    }
                }
            }

            // Out of bounds checks
            if (player.y + player.height > 460) {
                die(); // Fell into a pit/out of the map
            }
            if (player.y < 0) {
                player.y = 0;
                player.vy = 0; // Ceiling bounce
            }

            // Update Progress UI
            const progress = Math.min(100, Math.max(0, (player.x / mapWidth) * 100));
            progressFill.style.width = `${progress}%`;
        }

        // Particle Physics
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function isOverlap(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.w &&
            rect1.x + rect1.w > rect2.x &&
            rect1.y < rect2.y + rect2.h &&
            rect1.y + rect1.h > rect2.y
        );
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background Parallax Grid
        ctx.save();
        ctx.translate(-cameraX * 0.1 % 800, 0);
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        for (let i = 0; i < 20; i++) {
            ctx.fillRect(i * 100, 0, 2, 480);
            ctx.fillRect(0, i * 100 % 480, 800, 2);
        }
        ctx.restore();

        ctx.save();
        ctx.translate(-cameraX, 0);

        // Draw Map Objects
        for (let obj of objects) {
            if (obj.x < cameraX - 100 || obj.x > cameraX + 900) continue;

            if (obj.type === 'block') {
                ctx.fillStyle = '#1A237E';
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                ctx.strokeStyle = '#3949AB';
                ctx.lineWidth = 2;
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                // Inner detail
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(obj.x + 5, obj.y + 5, obj.w - 10, obj.h - 10);
            } else if (obj.type === 'spike') {
                ctx.fillStyle = '#D50000';
                ctx.beginPath();
                ctx.moveTo(obj.x + obj.w / 2, obj.y);
                ctx.lineTo(obj.x + obj.w - 2, obj.y + obj.h);
                ctx.lineTo(obj.x + 2, obj.y + obj.h);
                ctx.fill();
                ctx.strokeStyle = '#FF5252';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            } else if (obj.type === 'portal') {
                ctx.fillStyle = obj.mode === 'ship' ? 'rgba(255, 64, 129, 0.4)' : 'rgba(0, 230, 118, 0.4)';
                ctx.fillRect(obj.x + 12, obj.y, obj.w - 24, obj.h);
                ctx.strokeStyle = obj.mode === 'ship' ? '#FF4081' : '#00E676';
                ctx.lineWidth = 4;
                ctx.strokeRect(obj.x + 12, obj.y, obj.w - 24, obj.h);
            } else if (obj.type === 'win') {
                ctx.fillStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
            }
        }

        // Draw Player
        if (state === 'playing' || state === 'win') {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            if (player.mode === 'cube') {
                ctx.fillStyle = '#00E676';
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.width / 2, -player.height / 2, player.width, player.height);
                // Eyes
                ctx.fillStyle = '#000';
                ctx.fillRect(2, -8, 6, 6);
                ctx.fillRect(2, 2, 6, 6);
            } else {
                ctx.fillStyle = '#FF4081';
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-15, -12);
                ctx.lineTo(-10, 0);
                ctx.lineTo(-15, 12);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Ship thrust flame
                if (isHolding) {
                    ctx.fillStyle = '#FFEB3B';
                    ctx.beginPath();
                    ctx.moveTo(-10, 0);
                    ctx.lineTo(-25 - Math.random()*15, -6);
                    ctx.lineTo(-25 - Math.random()*15, 6);
                    ctx.closePath();
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        // Draw Particles
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Start rendering
    gameLoop();

</script>
</body>
</html>
