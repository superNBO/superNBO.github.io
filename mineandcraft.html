<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Minecraft - Improved</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #87CEEB;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-top: -10px;
            margin-left: -10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            text-align: center;
            line-height: 20px;
            pointer-events: none;
            z-index: 100;
            text-shadow: 1px 1px 2px black;
        }
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            z-index: 200;
            cursor: pointer;
        }
        #instructions {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
        }
        .key {
            background: #444;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid #666;
        }

        /* Toolbar Styles */
        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            z-index: 150;
        }
        .slot {
            width: 40px;
            height: 40px;
            border: 3px solid #555;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            box-sizing: border-box;
            transition: 0.1s;
        }
        .slot.active {
            border-color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="crosshair">+</div>

    <div id="toolbar">
        <div class="slot active" id="slot-1" style="background-color: #55aa55;" title="Grass (1)">1</div>
        <div class="slot" id="slot-2" style="background-color: #8b5a2b;" title="Dirt (2)">2</div>
        <div class="slot" id="slot-3" style="background-color: #888888;" title="Stone (3)">3</div>
        <div class="slot" id="slot-4" style="background-color: #5c4033;" title="Wood (4)">4</div>
        <div class="slot" id="slot-5" style="background-color: #228b22;" title="Leaves (5)">5</div>
        <div class="slot" id="slot-6" style="background-color: #add8e6;" title="Glass (6)">6</div>
        <div class="slot" id="slot-7" style="background-color: #b22222;" title="Brick (7)">7</div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h1 style="font-size: 44px; margin-bottom: 10px; text-shadow: 2px 2px 0 #000;">Web Minecraft</h1>
            <p style="color:#aaa;">Click anywhere to start</p>
            <br />
            Move: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span><br />
            Jump: <span class="key">SPACE</span><br />
            Select Block: <span class="key">1</span> - <span class="key">7</span><br />
            Mine: <span class="key">LEFT CLICK</span> | Place: <span class="key">RIGHT CLICK</span>
        </div>
    </div>

    <!-- Import Three.js and PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- Game Setup ---
        let camera, scene, renderer, controls;
        const objects = []; // Array of all blocks
        let raycaster;

        // Block Highlight
        let rollOverMesh;

        // Movement variables
        let moveForward = false, moveBackward = false;
        let moveLeft = false, moveRight = false;
        let canJump = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Block Size & Geometry
        const blockSize = 1;
        const blockGeo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);

        // Materials Library
        const materials = [
            // 1. Grass (dirt sides, grass top)
            [
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // right
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // left
                new THREE.MeshLambertMaterial({ color: 0x55aa55 }), // top
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // bottom
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // front
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b })  // back
            ],
            // 2. Dirt
            new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
            // 3. Stone
            new THREE.MeshLambertMaterial({ color: 0x888888 }),
            // 4. Wood
            new THREE.MeshLambertMaterial({ color: 0x5c4033 }),
            // 5. Leaves (Transparent)
            new THREE.MeshLambertMaterial({ color: 0x228b22, transparent: true, opacity: 0.8 }),
            // 6. Glass (Transparent)
            new THREE.MeshLambertMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.4 }),
            // 7. Brick
            new THREE.MeshLambertMaterial({ color: 0xb22222 })
        ];

        let currentMaterial = 0; // Default: Grass

        init();
        animate();

        function init() {
            // 1. Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 15, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 0); // Spawn in air to fall onto map

            // 2. Lighting
            const ambientLight = new THREE.AmbientLight(0xcccccc, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 30, 15);
            scene.add(dirLight);

            // 3. Controls (Pointer Lock)
            controls = new THREE.PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');

            blocker.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () { blocker.style.display = 'none'; });
            controls.addEventListener('unlock', function () { blocker.style.display = 'flex'; });

            scene.add(controls.getObject());

            // Key Listeners
            document.addEventListener('keydown', (event) => {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump === true) velocity.y += 12; canJump = false; break;
                }

                // Inventory Selection (Keys 1-7)
                if (event.key >= '1' && event.key <= '7') {
                    currentMaterial = parseInt(event.key) - 1;
                    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
                    document.getElementById('slot-' + event.key).classList.add('active');
                }
            });

            document.addEventListener('keyup', (event) => {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            });

            // 4. Block Highlighter (Wireframe Box)
            const rollOverGeo = new THREE.BoxGeometry(blockSize + 0.01, blockSize + 0.01, blockSize + 0.01);
            const rollOverMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
            rollOverMesh = new THREE.LineSegments(new THREE.EdgesGeometry(rollOverGeo), rollOverMat);
            rollOverMesh.visible = false;
            scene.add(rollOverMesh);

            // 5. World Generation
            generateWorld();

            // 6. Interaction
            raycaster = new THREE.Raycaster();
            document.addEventListener('mousedown', onMouseDown);

            // 7. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function createBlock(x, y, z, materialIndex) {
            const block = new THREE.Mesh(blockGeo, materials[materialIndex]);
            block.position.set(x, y, z);

            // Generate bounding box for perfect AABB collision
            block.geometry.computeBoundingBox();
            block.boundingBox = block.geometry.boundingBox.clone().translate(block.position);

            scene.add(block);
            objects.push(block);
            return block;
        }

        function generateWorld() {
            // Generate floor and hills
            for (let x = -20; x < 20; x++) {
                for (let z = -20; z < 20; z++) {

                    // Force a flat stone spawn area in the middle so player doesn't fall endlessly
                    if (Math.abs(x) < 3 && Math.abs(z) < 3) {
                        createBlock(x * blockSize, 0, z * blockSize, 2); // Stone
                        continue;
                    }

                    // Random noise for hills
                    const height = Math.floor(Math.sin(x/3) * Math.cos(z/3) * 2);

                    for(let y = -2; y <= height; y++) {
                        let mat = 2; // Stone underground
                        if (y === height) mat = 0; // Grass on top
                        else if (y === height - 1) mat = 1; // Dirt below grass

                        createBlock(x * blockSize, y * blockSize, z * blockSize, mat);
                    }
                }
            }
        }

        function onMouseDown(event) {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];

                if (event.button === 0) {
                    // LEFT CLICK: Break block
                    scene.remove(intersect.object);
                    objects.splice(objects.indexOf(intersect.object), 1);
                }
                else if (event.button === 2) {
                    // RIGHT CLICK: Place block
                    // Perfectly align to the side of the clicked block
                    const placePos = intersect.object.position.clone().add(intersect.face.normal.clone().multiplyScalar(blockSize));

                    // Prevent placing block inside the player
                    const playerBox = getPlayerBox(controls.getObject().position);
                    const proposedBox = new THREE.Box3().setFromCenterAndSize(placePos, new THREE.Vector3(1,1,1));

                    if (!playerBox.intersectsBox(proposedBox)) {
                        createBlock(placePos.x, placePos.y, placePos.z, currentMaterial);
                    }
                }
            }
        }

        // Generate player's bounding box based on camera position
        function getPlayerBox(pos) {
            // Camera is at eye level (y). Player extends 1.62 units down, and 0.18 units up.
            // Width is 0.6x0.6
            const min = new THREE.Vector3(pos.x - 0.3, pos.y - 1.62, pos.z - 0.3);
            const max = new THREE.Vector3(pos.x + 0.3, pos.y + 0.18, pos.z + 0.3);
            return new THREE.Box3(min, max);
        }

        function checkCollisions(playerBox) {
            for (let i = 0; i < objects.length; i++) {
                if (playerBox.intersectsBox(objects[i].boundingBox)) {
                    return true;
                }
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                // Update Highlighter Raycast
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(objects, false);
                if (intersects.length > 0 && intersects[0].distance < 6) {
                    rollOverMesh.position.copy(intersects[0].object.position);
                    rollOverMesh.visible = true;
                } else {
                    rollOverMesh.visible = false;
                }

                const time = performance.now();
                const delta = (time - prevTime) / 1000;
                const playerPos = controls.getObject().position;
                const oldPos = playerPos.clone();

                // Friction & Gravity
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 35.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 60.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                // --- X-Axis Movement & Collision ---
                controls.moveRight(-velocity.x * delta);
                if (checkCollisions(getPlayerBox(playerPos))) {
                    playerPos.x = oldPos.x;
                    velocity.x = 0;
                }

                // --- Z-Axis Movement & Collision ---
                controls.moveForward(-velocity.z * delta);
                if (checkCollisions(getPlayerBox(playerPos))) {
                    playerPos.z = oldPos.z;
                    velocity.z = 0;
                }

                // --- Y-Axis Movement & Collision ---
                playerPos.y += velocity.y * delta;
                if (checkCollisions(getPlayerBox(playerPos))) {
                    // Hitting the ground
                    if (velocity.y < 0) {
                        canJump = true;
                    }
                    playerPos.y = oldPos.y;
                    velocity.y = 0;
                } else {
                    // Not colliding on Y means we are in the air
                    canJump = false;
                }

                // Respawn if falling off map
                if (playerPos.y < -20) {
                    playerPos.set(0, 10, 0);
                    velocity.set(0, 0, 0);
                }
            }

            prevTime = performance.now();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
